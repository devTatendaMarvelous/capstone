services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartcrop
      POSTGRES_USER: smartcrop
      POSTGRES_PASSWORD: smartcrop
    ports:
      - "5432:5432"
    volumes:
      - smartcrop_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: dev-only-change-me-not-for-production-use
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://smartcrop:smartcrop@db:5432/smartcrop
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SMARTCROP_DEMO_PASSWORD: password
      SMARTCROP_CLEAN_DATASET: /data/processed/clean_dataset.csv
    volumes:
      - ./backend/ml_models:/app/ml_models:ro
      - ./data-science/data/processed:/data/processed:ro
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  smartcrop_pg:
